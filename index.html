
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101010">
<title>DeliX Delivery</title>
<style>
*{box-sizing:border-box}
body{
margin:0;background:#101010;color:white;
font-family:Arial,sans-serif;
}
header{
padding:25px 20px;text-align:center;
background:#191919;border-bottom:1px solid #b89548;
}
.logo{font-size:38px;font-weight:bold;color:#d5b15d}
header p{color:#bbb;margin-bottom:0}
main{padding:25px 18px;max-width:600px;margin:auto}
h2{color:#d5b15d}
.welcome{
background:#202020;padding:22px;
border-radius:16px;text-align:center;
margin-bottom:25px;
}
.welcome p{color:#ccc}
.services{
display:grid;grid-template-columns:1fr 1fr;gap:14px;
}
.service{
background:#202020;border:1px solid #51452d;
border-radius:14px;padding:22px 10px;
text-align:center;font-size:17px;
}
.service span{display:block;font-size:30px;margin-bottom:12px}
button{
width:100%;padding:16px;margin-top:22px;
background:#c6a454;color:#111;border:0;
border-radius:12px;font-size:18px;font-weight:bold;
}
footer{text-align:center;color:#999;padding:30px}
</style>
</head>
<body>
<header>
<div class="logo">DeliX</div>
<p>كل طلباتك.. نوصلها لك</p>
</header>
<main>
<div class="welcome">
<h2>أهلاً بيك في DeliX</h2>
<p>اطلب اللي محتاجه وإحنا نوصل لحد باب بيتك</p>
</div>
<h2>اختار الخدمة</h2>
<div class="services">
<div class="service"><span>🍔</span>طلبات المطاعم</div>
<div class="service"><span>🛍️</span>طلبات المحلات</div>
<div class="service"><span>📦</span>توصيل الطرود</div>
<div class="service"><span>🛵</span>خدمة التوصيل</div>
</div>
<button onclick="alert('قريباً: تسجيل حساب العميل')">
ابدأ الآن
</button>
</main>
<footer>DeliX Delivery © 2026</footer>
</body>
</html>
